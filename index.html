<!doctype html>
<html lang="fr">

  <head>

    <meta charset="UTF-8" />

    <!-- 🔥 LOGO / FAVICON -->
    <link
      rel="icon"
      type="image/png"
      href="/logo.png"
    />

    <!-- 🔥 IOS -->
    <link
      rel="apple-touch-icon"
      href="/logo.png"
    />

    <!-- 🔥 PWA -->
    <link
      rel="manifest"
      href="/manifest.json"
    />

    <!-- 🔥 RESPONSIVE -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- 🔥 MOBILE THEME -->
    <meta
      name="theme-color"
      content="#dc2626"
    />

    <!-- 🔥 TITLE -->
    <title>LifeLink Dashboard</title>

    <!-- 🔥 THEME INIT -->
    <script>
      const theme =
        localStorage.getItem("theme") ||
        "auto";

      if (theme === "dark") {
        document.documentElement.classList.add(
          "dark"
        );
      } else if (
        theme === "light"
      ) {
        document.documentElement.classList.remove(
          "dark"
        );
      } else {
        if (
          window.matchMedia(
            "(prefers-color-scheme: dark)"
          ).matches
        ) {
          document.documentElement.classList.add(
            "dark"
          );
        }
      }
    </script>

  </head>

  <body>

    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>

  </body>

</html>
